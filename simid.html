<!doctype html>
<html>
<head>
  <script src="https://raw.githack.com/InteractiveAdvertisingBureau/SIMID/master/examples/simid_protocol.js"></script>
  <script src="https://raw.githack.com/InteractiveAdvertisingBureau/SIMID/master/examples/creatives/base_simid_creative.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent; /* 保持透明，露出底层视频 */
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      -ms-touch-action: none;
    }
    body, div, img {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    /* 滑动引导 UI 样式 */
    .arrow_text_wrap {
      align-items: center;
      bottom: 0.12rem;
      display: flex;
      flex-direction: column;
      left: 0;
      pointer-events: none;
      position: absolute;
      width: 100%;
    }
    .arrow {
      animation: arrow 1s ease-in-out infinite;
      height: 0.2rem;
      margin-bottom: 0.04rem;
      transform-origin: center 0.36rem;
      width: 0.37rem;
      will-change: transform;
    }
    @keyframes arrow {
      0%, to { transform: scaleY(1); }
      50% { transform: scaleY(1.3); }
    }
    .move_text {
      color: #fff;
      font-size: 0.18rem;
      line-height: 0.22rem;
      text-align: center;
      white-space: nowrap;
    }
    .move_text span {
      position: relative;
      z-index: 100;
    }
    .move_text span:before {
      content: "Swipe to see more";
      position: absolute;
      z-index: -1;
      -webkit-text-stroke: 0.04rem #373737;
    }
    .bottom-slider {
      height: 0.05rem;
      margin-top: 0.04rem;
      width: 1.61rem;
    }
  </style>
  <script>
    // 移动端 REM 适配
    var designSize = 375, remBase = 100;
    function setRem() {
      var e = document.documentElement.clientWidth,
          t = document.documentElement.clientHeight,
          n = t < e ? t : e;
      document.documentElement.style.fontSize = (n / designSize) * remBase + "px";
    }
    setRem();
    window.addEventListener("resize", setRem, false);

    // 文字缩放自适应
    function normalizeMaxWidth(e) {
      if ("number" == typeof e) return e;
      if ("string" == typeof e) {
        var t = e.trim().toLowerCase();
        if (t.endsWith("px")) return Number(t.replace("px", ""));
        if (t.endsWith("rem")) {
          var r = parseFloat(getComputedStyle(document.documentElement).fontSize);
          return Number(t.replace("rem", "")) * r;
        }
        var n = Number(t);
        return isNaN(n) ? 0 : n;
      }
      return 0;
    }
    function autoScaleText(e) {
      var t = document.querySelector("#" + e + " > span"),
          r = document.querySelector("#" + e);
      if (t && r) {
        var n = t.offsetWidth, a = normalizeMaxWidth(r.dataset.maxWidth);
        if (n > a) {
          var i = getComputedStyle(r), l = i.textAlign, f = a / n;
          if ("flex" === i.display || ((r.style.display = "flex"), (r.style.justifyContent = {
            start: "flex-start", left: "flex-start", center: "center", right: "flex-end"
          }[l || "left"]), (t.style.transformOrigin = {
            start: "0 center", left: "0 center", right: "right center"
          }[l || "left"])), (t.style.transform = "scale(" + f + ")"), (t.style.transformOrigin = l + " center"));
        }
      }
    }
  </script>
</head>
<body>
  <!-- 滑动引导 UI -->
  <div class="arrow_text_wrap">
    <img
      src="https://aimg.kwcdn.com/upload_aimg/lp/09428c0b-253e-4eb6-8549-3f1d3cc78610.png.slim.png"
      class="arrow"
    />
    <div id="arrow_move_text" class="move_text" data-max-width="3rem">
      <span>Swipe to see more</span>
    </div>
    <img
      src="https://aimg.kwcdn.com/upload_aimg/lp/7c666efb-eb82-47c3-97ac-778ee6ae298b.png.slim.png"
      class="bottom-slider"
    />
  </div>

  <script>
    class SimidSwipe extends BaseSimidCreative {
      constructor() {
        super();
        this.startX = 0;
        this.startY = 0;
        this.moveThreshold = 5;
        this.hasClicked = false;
        this.fallbackClickUrl = "https://www.temu.com"; // 默认兜底链接
        
        this.addSwipeActions_();
      }

      /** 
       * 监听播放器传递过来的数据，获取 clickThruUrl 等 
       * (基类中可以在 init 时获取，这里简单处理)
       */
      onStart() {
        super.onStart();
      }

      /**
       * 绑定滑动事件
       */
      addSwipeActions_() {
        const self = this;
        
        function getPosition(t) {
          return t.touches && t.touches.length > 0
            ? { x: t.touches[0].clientX, y: t.touches[0].clientY }
            : t.changedTouches && t.changedTouches.length > 0
              ? { x: t.changedTouches[0].clientX, y: t.changedTouches[0].clientY }
              : { x: t.clientX, y: t.clientY };
        }

        function onTouchStart(e) {
          const pos = getPosition(e);
          self.startX = pos.x;
          self.startY = pos.y;
        }

        function onTouchEnd(e) {
          const pos = getPosition(e);
          const distance = Math.hypot(pos.x - self.startX, pos.y - self.startY);
          self.startX = 0;
          self.startY = 0;

          // 滑动距离超过阈值，触发跳转
          if (distance > self.moveThreshold) {
            self.triggerClick();
          }
        }

        document.addEventListener("mousedown", onTouchStart);
        document.addEventListener("mouseup", onTouchEnd);
        document.addEventListener("touchstart", onTouchStart, { passive: true });
        document.addEventListener("touchend", onTouchEnd, { passive: true });

        // 初始化文字缩放
        autoScaleText("arrow_move_text");
      }

      /**
       * 触发跳转逻辑
       */
      triggerClick() {
        if (this.hasClicked) return;
        this.hasClicked = true;

        const url = this.fallbackClickUrl;

        // 1. 标准 SIMID 协议发送（遵循文档要求，加入 playerHandles: true）
        try {
          this.simidProtocol.sendMessage(CreativeMessage.CLICK_THRU, { 
            url: url,
            playerHandles: true 
          });
        } catch (e) {
          console.warn("SIMID sendMessage failed", e);
        }

        // 2. 兜底降级（参考你的示例，虽然沙箱通常拦截，但在某些宽松环境下有用）
        let w = null;
        try { w = window.open(url, '_blank'); } catch (e) {}
        if (!w) {
          try {
            const a = document.createElement('a');
            a.href = url; 
            a.target = '_blank'; 
            a.rel = 'noopener';
            document.body.appendChild(a); 
            a.click(); 
            a.remove();
          } catch (e) {}
        }

        // 防止连续重复触发
        setTimeout(() => { this.hasClicked = false; }, 1000);
      }
    }

    // 实例化并启动 SIMID 会话
    const simidSwipe = new SimidSwipe();
    simidSwipe.ready();
  </script>
</body>
</html>
